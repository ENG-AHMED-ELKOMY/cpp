                questions: [
                    { id: "21_q1", type: "mcq", text: "1. How many times \"Ankit\" is get printed?", code: "int main()\n{\n    int x;\n    for(x=-1; x<=10; x++)\n        if (x<5)\n            continue;\n        else\n            break;\n    cout<<(\"Ankit\");\n    return 0;\n}", options: ["A. Infinite times.", "B. 11 times", "C. 0 times", "D. 10 times"], answer: 2 },
                    { id: "21_q2", type: "mcq", text: "2. What is the output of C++ program?", code: "int main()\n{\n    int a=32;\n    do\n    {\n        cout << (a);\n        a++;\n        if(a>35)\n            break;\n    } while(1);\n    return 0;\n}", options: ["A. No output.", "B. 32 33 34", "C. 32 33 34 35", "D. Compiler error."], answer: 2 },
                    { id: "21_q3", type: "mcq", text: "3. What will be the output of the following C++ code?", code: "void main()\n{\n    int array1[] = {1200, 200, 2300, 1230, 1543};\n    int array2[] = {12, 14, 16, 18, 20};\n    int temp, result = 0;\n    for (temp = 0; temp < 5; temp++) {\n        result += array1 [temp];\n    }\n    for (temp = 0; temp < 4; temp++) {\n        result += array2[temp];\n    }\n    cout << result;\n}", options: ["A. 6522", "B. 6553", "C. 6533", "D. 12200"], answer: 1 },
                    { id: "21_q4", type: "mcq", text: "4. How many times will the program execute the code inside the loop?", code: "void main()\n{\n    int Sum = 0;\n    int Num = 1;\n    while (Sum<10) {\n        Sum=Sum+Num;\n        Num=Num+1;\n    }\n}", options: ["A. 0", "B. 5", "C. 4", "D. 10"], answer: 2 }
                ]
            }
        };

        let activeRoomKey = "room_2025";
        let roomScores = {};
        let userAnswers = {};
        let currentTheme = "dark";

        function loadStateFromStorage() {
            try {
                const storedScores = localStorage.getItem("flawless_portal_scores");
                const storedAnswers = localStorage.getItem("flawless_portal_answers");
                const storedActiveRoom = localStorage.getItem("flawless_portal_activeRoom");
                const storedTheme = localStorage.getItem("flawless_portal_theme");
                
                if (storedScores) roomScores = JSON.parse(storedScores);
                if (storedAnswers) userAnswers = JSON.parse(storedAnswers);
                if (storedActiveRoom && examDatabase[storedActiveRoom]) activeRoomKey = storedActiveRoom;
                if (storedTheme) currentTheme = storedTheme;
            } catch (e) {
                console.error("Storage system read error:", e);
            }
        }

        function saveStateToStorage() {
            try {
                localStorage.setItem("flawless_portal_scores", JSON.stringify(roomScores));
                localStorage.setItem("flawless_portal_answers", JSON.stringify(userAnswers));
                localStorage.setItem("flawless_portal_activeRoom", activeRoomKey);
                localStorage.setItem("flawless_portal_theme", currentTheme);
            } catch (e) {
                console.error("Storage system write error:", e);
            }
        }

        function applyThemeOnLoad() {
            const bodyEl = document.getElementById("app-body");
            const toggleBtn = document.getElementById("theme-btn");
            if (currentTheme === "light") {
                bodyEl.classList.add("light-theme");
                toggleBtn.innerText = "☀️ Light";
            } else {
                bodyEl.classList.remove("light-theme");
                toggleBtn.innerText = "🌙 Dark";
            }
        }

        function toggleThemeEngineMode() {
            currentTheme = currentTheme === "dark" ? "light" : "dark";
            saveStateToStorage();
            applyThemeOnLoad();
        }

        function initializePlatform() {
            loadStateFromStorage();
            applyThemeOnLoad();
            
            const navbarContainer = document.getElementById("navbar-rooms-container");
            navbarContainer.innerHTML = "";
            
            Object.keys(examDatabase).forEach(key => {
                if (!roomScores[key]) roomScores[key] = { submitted: false, score: 0, total: 0 };
                if (!userAnswers[key]) userAnswers[key] = {};
                
                const btn = document.createElement("button");
                btn.id = `tab-${key}`;
                btn.type = "button";
                btn.className = "shrink-0 px-4 py-2 rounded-xl text-xs font-bold tracking-tight transition-all cursor-pointer flex items-center gap-2 text-slate-400 hover:text-slate-200 bg-slate-900/40 border border-slate-800/40";
                btn.onclick = () => switchRoom(key);
                
                const shortTitle = key.replace("room_", "Year ");
                btn.innerHTML = `
                    <span>${shortTitle}</span>
                    <span id="badge-${key}" class="text-[9px] px-1.5 py-0.2 rounded font-bold bg-slate-950 border border-slate-800 text-slate-500">IDLE</span>
                `;
                navbarContainer.appendChild(btn);
                updateNavbarBadgeStatus(key);
            });
            
            switchRoom(activeRoomKey);
            calculateOverallMetrics();
        }

        function updateNavbarBadgeStatus(roomKey) {
            const badge = document.getElementById(`badge-${roomKey}`);
            const state = roomScores[roomKey];
            if (!badge || !state) return;

            if (state.submitted) {
                if (state.total > 0) {
                    const pct = Math.round((state.score / state.total) * 100);
                    badge.innerText = `${pct}%`;
                    badge.className = `text-[9px] px-1.5 py-0.2 rounded border font-bold ${pct >= 50 ? 'bg-emerald-950/40 text-emerald-500 border-emerald-800/30' : 'bg-rose-950/40 text-rose-400 border-rose-800/30'}`;
                } else {
                    badge.innerText = "DONE";
                    badge.className = "text-[9px] px-1.5 py-0.2 rounded border font-bold bg-indigo-950/40 text-indigo-400 border-indigo-800/30";
                }
            } else {
                badge.innerText = "IDLE";
                badge.className = "text-[9px] px-1.5 py-0.2 rounded bg-slate-950 border border-slate-800 text-slate-500 font-bold";
            }
        }

        function switchRoom(roomKey) {
            const previousTab = document.getElementById(`tab-${activeRoomKey}`);
            if (previousTab) {
                previousTab.className = "shrink-0 px-4 py-2 rounded-xl text-xs font-semibold tracking-tight transition-all cursor-pointer flex items-center gap-2 text-slate-400 hover:text-slate-200 bg-slate-900/40 border border-slate-800/40";
            }

            activeRoomKey = roomKey;
            saveStateToStorage();
            
            const activeTab = document.getElementById(`tab-${roomKey}`);
            if (activeTab) {
                activeTab.className = "shrink-0 px-4 py-2 rounded-xl text-xs font-bold tracking-tight transition-all cursor-pointer flex items-center gap-2 bg-indigo-600 text-white shadow-md border border-indigo-500/30";
                activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

            const data = examDatabase[roomKey];
            document.getElementById("room-title").innerText = data.title;
            document.getElementById("room-meta").innerText = data.meta;

            renderQuestions(data.questions);
            updateScoreBannerDisplay();
            
            if (roomScores[activeRoomKey].submitted) {
                applyVisualCorrectionFeedback();
            }
        }

        function renderQuestions(questions) {
            const container = document.getElementById("exam-questions-form");
            container.innerHTML = "";
            const isSubmitted = roomScores[activeRoomKey].submitted;

            questions.forEach((q, idx) => {
                const card = document.createElement("div");
                card.className = "card-bg border rounded-2xl p-5 space-y-4 shadow-sm";
                
                const header = document.createElement("div");
                header.className = "flex justify-between items-center pb-2 border-b border-slate-800/40";
                header.innerHTML = `
                    <span class="text-xs font-bold text-indigo-400 bg-indigo-500/5 px-2.5 py-1 rounded-md border border-indigo-500/10 uppercase tracking-wider">Question ${idx + 1}</span>
                    <div id="status-${q.id}" class="text-xs font-bold tracking-wide"></div>
                `;
                card.appendChild(header);

                const body = document.createElement("div");
                body.className = "text-main leading-relaxed text-sm font-semibold";
                body.innerHTML = q.text;
                card.appendChild(body);

                if (q.code) {
                    const codeBox = document.createElement("div");
                    codeBox.className = "code-box-bg relative rounded-xl border p-4 shadow-inner overflow-x-auto my-3";
                    codeBox.innerHTML = `
                        <div class="absolute right-3 top-2 text-[9px] font-bold text-slate-500 uppercase tracking-widest pointer-events-none select-none code-font">C++ Code</div>
                        <pre class="code-font text-xs md:text-sm font-medium leading-relaxed whitespace-pre">${q.code}</pre>
                    `;
                    card.appendChild(codeBox);
                }

                const savedAnswer = userAnswers[activeRoomKey][q.id];

                if (q.type === "mcq") {
                    const optsDiv = document.createElement("div");
                    optsDiv.className = "grid grid-cols-1 md:grid-cols-2 gap-3 pt-1";
                    q.options.forEach((opt, oIdx) => {
                        const isChecked = savedAnswer !== undefined && parseInt(savedAnswer) === oIdx;
                        const label = document.createElement("label");
                        label.id = `wrapper-${q.id}-${oIdx}`;
                        label.className = "option-wrapper flex items-center gap-3 border p-4 rounded-xl cursor-pointer transition-all group";
                        label.innerHTML = `
                            <input type="radio" name="input-${q.id}" value="${oIdx}" ${isChecked ? 'checked' : ''} ${isSubmitted ? 'disabled' : ''} onchange="storeAnswer('${q.id}', this.value)" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500/40 accent-indigo-500">
                            <span class="text-xs md:text-sm font-medium transition-colors">${opt}</span>
                        `;
                        optsDiv.appendChild(label);
                    });
                    card.appendChild(optsDiv);
                } else if (q.type === "tf") {
                    const optsDiv = document.createElement("div");
                    optsDiv.className = "flex gap-3 pt-1";
                    const isTrueChecked = savedAnswer === "true";
                    const isFalseChecked = savedAnswer === "false";
                    
                    optsDiv.innerHTML = `
                        <label id="wrapper-${q.id}-true" class="option-wrapper flex items-center gap-3 border px-5 py-3 rounded-xl cursor-pointer transition-all group">
                            <input type="radio" name="input-${q.id}" value="true" ${isTrueChecked ? 'checked' : ''} ${isSubmitted ? 'disabled' : ''} onchange="storeAnswer('${q.id}', this.value)" class="w-4 h-4 accent-indigo-500">
                            <span class="text-xs md:text-sm font-bold">True</span>
                        </label>
                        <label id="wrapper-${q.id}-false" class="option-wrapper flex items-center gap-3 border px-5 py-3 rounded-xl cursor-pointer transition-all group">
                            <input type="radio" name="input-${q.id}" value="false" ${isFalseChecked ? 'checked' : ''} ${isSubmitted ? 'disabled' : ''} onchange="storeAnswer('${q.id}', this.value)" class="w-4 h-4 accent-indigo-500">
                            <span class="text-xs md:text-sm font-bold">False</span>
                        </label>
                    `;
                    card.appendChild(optsDiv);
                } else if (q.type === "subjective") {
                    const textDiv = document.createElement("div");
                    textDiv.className = "space-y-3 pt-1";
                    textDiv.innerHTML = `
                        <textarea id="input-${q.id}" rows="5" ${isSubmitted ? 'disabled' : ''} oninput="storeAnswer('${q.id}', this.value)" class="w-full bg-slate-950/20 border border-slate-700/80 rounded-xl p-4 code-font text-xs md:text-sm text-emerald-500 focus:outline-none transition-colors" placeholder="// Input code / analysis answer here...">${savedAnswer || ""}</textarea>
                        <button type="button" onclick="toggleSolution('${q.id}')" class="text-[11px] text-indigo-500 hover:text-indigo-400 font-bold flex items-center gap-1.5 cursor-pointer select-none">
                            <span>💡 View Reference Model Solution</span>
                        </button>
                        <div id="sol-${q.id}" class="hidden bg-slate-950/20 border border-slate-700 rounded-xl p-4 space-y-2">
                            <div class="text-[10px] uppercase tracking-wider font-bold text-indigo-500">Solution Template:</div>
                            <pre class="code-font text-main text-xs whitespace-pre-wrap leading-relaxed">${q.modelSolution}</pre>
                        </div>
                    `;
                    card.appendChild(textDiv);
                }
                container.appendChild(card);
            });
        }

        function storeAnswer(questionId, value) {
            userAnswers[activeRoomKey][questionId] = value;
            saveStateToStorage();
        }

        function toggleSolution(id) {
            const el = document.getElementById(`sol-${id}`);
            if (el) el.classList.toggle("hidden");
        }

        function submitCurrentRoom() {
            const questions = examDatabase[activeRoomKey].questions;
            let correctCount = 0;
            let autoGradedTotal = 0;

            questions.forEach(q => {
                if (q.type === "mcq") {
                    autoGradedTotal++;
                    const selected = userAnswers[activeRoomKey][q.id];
                    if (selected !== undefined && parseInt(selected) === q.answer) correctCount++;
                } else if (q.type === "tf") {
                    autoGradedTotal++;
                    const selected = userAnswers[activeRoomKey][q.id];
                    if (selected !== undefined && (selected === "true") === q.answer) correctCount++;
                }
            });

            roomScores[activeRoomKey] = { submitted: true, score: correctCount, total: autoGradedTotal };
            saveStateToStorage();
            
            renderQuestions(questions);
            applyVisualCorrectionFeedback();
            
            updateNavbarBadgeStatus(activeRoomKey);
            updateScoreBannerDisplay();
            calculateOverallMetrics();
        }

        function applyVisualCorrectionFeedback() {
            const questions = examDatabase[activeRoomKey].questions;

            questions.forEach(q => {
                const statusEl = document.getElementById(`status-${q.id}`);
                const savedAns = userAnswers[activeRoomKey][q.id];

                if (q.type === "mcq") {
                    q.options.forEach((_, oIdx) => {
                        const optWrapper = document.getElementById(`wrapper-${q.id}-${oIdx}`);
                        if (optWrapper) optWrapper.className = "option-wrapper flex items-center gap-3 border p-4 rounded-xl opacity-60";
                    });

                    const correctWrapper = document.getElementById(`wrapper-${q.id}-${q.answer}`);
                    if (correctWrapper) {
                        correctWrapper.className = "flex items-center gap-3 bg-emerald-500/20 border-emerald-500 text-emerald-600 dark:text-emerald-400 font-bold rounded-xl opacity-100";
                    }

                    if (savedAns !== undefined) {
                        const userIdx = parseInt(savedAns);
                        if (userIdx === q.answer) {
                            if (statusEl) statusEl.innerHTML = "<span class='text-emerald-500 font-bold'>✓ Correct</span>";
                        } else {
                            const wrongWrapper = document.getElementById(`wrapper-${q.id}-${userIdx}`);
                            if (wrongWrapper) {
                                wrongWrapper.className = "flex items-center gap-3 bg-rose-500/20 border-rose-500 text-rose-600 dark:text-rose-400 font-bold rounded-xl opacity-100";
                            }
                            if (statusEl) statusEl.innerHTML = "<span class='text-rose-500 font-bold'>✗ Incorrect</span>";
                        }
                    } else {
                        if (statusEl) statusEl.innerHTML = "<span class='text-amber-500 font-semibold'>Unanswered</span>";
                    }

                } else if (q.type === "tf") {
                    const trueWrapper = document.getElementById(`wrapper-${q.id}-true`);
                    const falseWrapper = document.getElementById(`wrapper-${q.id}-false`);

                    if (trueWrapper) trueWrapper.className = "option-wrapper flex items-center gap-3 border px-5 py-3 rounded-xl opacity-60";
                    if (falseWrapper) falseWrapper.className = "option-wrapper flex items-center gap-3 border px-5 py-3 rounded-xl opacity-60";

                    const correctStr = q.answer ? "true" : "false";
                    const correctWrapper = document.getElementById(`wrapper-${q.id}-${correctStr}`);
                    if (correctWrapper) {
                        correctWrapper.className = "flex items-center gap-3 bg-emerald-500/20 border-emerald-500 text-emerald-600 dark:text-emerald-400 font-bold px-5 py-3 rounded-xl opacity-100";
                    }

                    if (savedAns !== undefined) {
                        if (savedAns === correctStr) {
                            if (statusEl) statusEl.innerHTML = "<span class='text-emerald-500 font-bold'>✓ Correct</span>";
                        } else {
                            const wrongWrapper = document.getElementById(`wrapper-${q.id}-${savedAns}`);
                            if (wrongWrapper) {
                                wrongWrapper.className = "flex items-center gap-3 bg-rose-500/20 border-rose-500 text-rose-600 dark:text-rose-400 font-bold px-5 py-3 rounded-xl opacity-100";
                            }
                            if (statusEl) statusEl.innerHTML = "<span class='text-rose-500 font-bold'>✗ Incorrect</span>";
                        }
                    } else {
                        if (statusEl) statusEl.innerHTML = "<span class='text-amber-500 font-semibold'>Unanswered</span>";
                    }
                }
            });
        }

        function resetCurrentRoom() {
            roomScores[activeRoomKey] = { submitted: false, score: 0, total: 0 };
            userAnswers[activeRoomKey] = {};
            saveStateToStorage();
            
            updateNavbarBadgeStatus(activeRoomKey);
            renderQuestions(examDatabase[activeRoomKey].questions);
            updateScoreBannerDisplay();
            calculateOverallMetrics();
        }

        function updateScoreBannerDisplay() {
            const banner = document.getElementById("room-score-banner");
            const state = roomScores[activeRoomKey];

            if (state && state.submitted && state.total > 0) {
                banner.classList.remove("hidden");
                document.getElementById("room-score-breakdown").innerText = `You scored ${state.score} out of ${state.total} questions cleanly inside this exam workspace module iteration.`;
                const pct = Math.round((state.score / state.total) * 100);
                document.getElementById("room-percentage-badge").innerText = `${pct}%`;
            } else {
                banner.classList.add("hidden");
            }
        }

        function calculateOverallMetrics() {
            let totalScore = 0;
            let totalGraded = 0;
            const keys = Object.keys(examDatabase);

            keys.forEach(key => {
                if (roomScores[key] && roomScores[key].submitted) {
                    totalScore += roomScores[key].score;
                    totalGraded += roomScores[key].total;
                }
            });

            const overallPct = totalGraded > 0 ? Math.round((totalScore / totalGraded) * 100) : 0;
            document.getElementById("overall-score-txt").innerText = `${overallPct}% Passed`;
        }

        window.onload = initializePlatform;
    </script>
</body>
</html>
