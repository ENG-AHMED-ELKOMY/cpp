        let activeRoomKey = "room_2025";
        const roomScores = {};

        function initializePlatform() {
            const navbarContainer = document.getElementById("navbar-rooms-container");
            navbarContainer.innerHTML = "";
            
            Object.keys(examDatabase).forEach(key => {
                roomScores[key] = { submitted: false, score: 0, total: 0 };
                
                const btn = document.createElement("button");
                btn.id = `tab-${key}`;
                btn.type = "button";
                btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold tracking-tight transition-all cursor-pointer flex items-center gap-2 text-slate-400 hover:text-slate-200 hover:bg-slate-900/60";
                btn.onclick = () => switchRoom(key);
                
                // Get shorthand text representation for minimalist premium layout
                const shortTitle = examDatabase[key].title.replace("Final Exam ", "");
                btn.innerHTML = `
                    <span>${shortTitle}</span>
                    <span id="badge-${key}" class="text-[9px] px-1.5 py-0.2 rounded bg-slate-900 border border-slate-800 text-slate-500 font-bold">IDLE</span>
                `;
                navbarContainer.appendChild(btn);
            });
            
            switchRoom("room_2025");
        }

        function switchRoom(roomKey) {
            // Uncheck old active class layout safely
            const previousTab = document.getElementById(`tab-${activeRoomKey}`);
            if (previousTab) {
                previousTab.classList.remove("bg-indigo-600", "text-white", "shadow-md", "shadow-indigo-600/10");
                previousTab.classList.add("text-slate-400", "hover:text-slate-200", "hover:bg-slate-900/60");
            }

            activeRoomKey = roomKey;
            
            const activeTab = document.getElementById(`tab-${roomKey}`);
            if (activeTab) {
                activeTab.classList.remove("text-slate-400", "hover:text-slate-200", "hover:bg-slate-900/60");
                activeTab.classList.add("bg-indigo-600", "text-white", "shadow-md", "shadow-indigo-600/10");
            }

            // Update Dynamic Display Nodes
            const data = examDatabase[roomKey];
            document.getElementById("room-title").innerText = data.title;
            document.getElementById("room-meta").innerText = data.meta;

            renderQuestions(data.questions);
            updateScoreBannerDisplay();
        }

        function renderQuestions(questions) {
            const container = document.getElementById("exam-questions-form");
            container.innerHTML = "";

            questions.forEach((q, idx) => {
                const card = document.createElement("div");
                card.className = "bg-slate-900/40 border border-slate-800 rounded-2xl p-6 space-y-4 shadow-sm";
                
                const header = document.createElement("div");
                header.className = "flex justify-between items-center pb-2 border-b border-slate-800/60";
                header.innerHTML = `
                    <span class="text-xs font-bold text-indigo-400 bg-indigo-500/5 px-2.5 py-1 rounded-md border border-indigo-500/10 uppercase tracking-wider">Question ${idx + 1}</span>
                    <div id="status-${q.id}" class="text-xs font-semibold tracking-wide"></div>
                `;
                card.appendChild(header);

                // Question Text Render Node
                const body = document.createElement("div");
                body.className = "text-slate-200 leading-relaxed text-sm font-medium";
                body.innerHTML = q.text;
                card.appendChild(body);

                // ISOLATED CODE BLOCK: Premium Monospace Container Box
                if (q.code) {
                    const codeBox = document.createElement("div");
                    codeBox.className = "relative rounded-xl border border-slate-800 bg-slate-950 p-4 shadow-inner overflow-x-auto my-3";
                    codeBox.innerHTML = `
                        <div class="absolute right-3 top-2 text-[9px] font-bold text-slate-600 uppercase tracking-widest pointer-events-none select-none code-font">C++ Source</div>
                        <pre class="code-font text-emerald-400 text-xs md:text-sm leading-relaxed whitespace-pre">${q.code}</pre>
                    `;
                    card.appendChild(codeBox);
                }

                // Inputs Matrix Definitions Injection Thread
                if (q.type === "mcq") {
                    const optsDiv = document.createElement("div");
                    optsDiv.className = "grid grid-cols-1 md:grid-cols-2 gap-3 pt-1";
                    q.options.forEach((opt, oIdx) => {
                        const label = document.createElement("label");
                        label.className = "flex items-center gap-3 bg-slate-950/20 border border-slate-800 hover:border-slate-700/60 p-4 rounded-xl cursor-pointer hover:bg-slate-900/30 transition-all group";
                        label.innerHTML = `
                            <input type="radio" name="input-${q.id}" value="${oIdx}" class="w-4 h-4 text-indigo-600 bg-slate-900 border-slate-700 focus:ring-indigo-500/40 accent-indigo-500">
                            <span class="text-xs md:text-sm text-slate-300 group-hover:text-slate-100 transition-colors">${opt}</span>
                        `;
                        optsDiv.appendChild(label);
                    });
                    card.appendChild(optsDiv);
                } else if (q.type === "tf") {
                    const optsDiv = document.createElement("div");
                    optsDiv.className = "flex gap-3 pt-1";
                    optsDiv.innerHTML = `
                        <label class="flex items-center gap-3 bg-slate-950/20 border border-slate-800 hover:border-slate-700/60 px-5 py-3 rounded-xl cursor-pointer hover:bg-slate-900/30 transition-all group">
                            <input type="radio" name="input-${q.id}" value="true" class="w-4 h-4 accent-indigo-500">
                            <span class="text-xs md:text-sm font-semibold text-slate-300 group-hover:text-slate-100">True</span>
                        </label>
                        <label class="flex items-center gap-3 bg-slate-950/20 border border-slate-800 hover:border-slate-700/60 px-5 py-3 rounded-xl cursor-pointer hover:bg-slate-900/30 transition-all group">
                            <input type="radio" name="input-${q.id}" value="false" class="w-4 h-4 accent-indigo-500">
                            <span class="text-xs md:text-sm font-semibold text-slate-300 group-hover:text-slate-100">False</span>
                        </label>
                    `;
                    card.appendChild(optsDiv);
                } else if (q.type === "subjective") {
                    const textDiv = document.createElement("div");
                    textDiv.className = "space-y-3 pt-1";
                    textDiv.innerHTML = `
                        <textarea id="input-${q.id}" rows="5" class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500/50 rounded-xl p-4 code-font text-xs md:text-sm text-emerald-400 focus:outline-none transition-colors" placeholder="// Input code script answer layout mapping elements..."></textarea>
                        <button type="button" onclick="toggleSolution('${q.id}')" class="text-[11px] text-indigo-400 hover:text-indigo-300 font-semibold flex items-center gap-1.5 cursor-pointer select-none">
                            <span>💡 View Expected Model Solution Reference</span>
                        </button>
                        <div id="sol-${q.id}" class="hidden bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-2">
                            <div class="text-[10px] uppercase tracking-wider font-bold text-indigo-400">Standard Code Verification Blueprint:</div>
                            <pre class="code-font text-slate-300 text-xs whitespace-pre-wrap leading-relaxed">${q.modelSolution}</pre>
                        </div>
                    `;
                    card.appendChild(textDiv);
                }

                container.appendChild(card);
            });
        }

        function toggleSolution(id) {
            const el = document.getElementById(`sol-${id}`);
            if (el) el.classList.toggle("hidden");
        }

        function submitCurrentRoom() {
            const questions = examDatabase[activeRoomKey].questions;
            let correctCount = 0;
            let autoGradedTotal = 0;

            questions.forEach(q => {
                const statusEl = document.getElementById(`status-${q.id}`);
                if (!statusEl) return;
                
                if (q.type === "mcq") {
                    autoGradedTotal++;
                    const selected = document.querySelector(`input[name="input-${q.id}"]:checked`);
                    if (selected && parseInt(selected.value) === q.answer) {
                        correctCount++;
                        statusEl.innerHTML = "<span class='text-emerald-400 flex items-center gap-1'>✓ Correct</span>";
                    } else {
                        const correctText = q.options[q.answer] ? q.options[q.answer] : "N/A";
                        statusEl.innerHTML = `<span class='text-rose-400'>✗ Expected: ${correctText}</span>`;
                    }
                } else if (q.type === "tf") {
                    autoGradedTotal++;
                    const selected = document.querySelector(`input[name="input-${q.id}"]:checked`);
                    if (selected && (selected.value === "true") === q.answer) {
                        correctCount++;
                        statusEl.innerHTML = "<span class='text-emerald-400'>✓ Correct</span>";
                    } else {
                        statusEl.innerHTML = `<span class='text-rose-400'>✗ Expected: ${q.answer ? 'True' : 'False'}</span>`;
                    }
                } else if (q.type === "subjective") {
                    statusEl.innerHTML = "<span class='text-indigo-400 font-medium'>📝 Answers Saved</span>";
                }
            });

            roomScores[activeRoomKey] = { submitted: true, score: correctCount, total: autoGradedTotal };

            const badge = document.getElementById(`badge-${activeRoomKey}`);
            if (badge) {
                if (autoGradedTotal > 0) {
                    const pct = Math.round((correctCount / autoGradedTotal) * 100);
                    badge.innerText = `${pct}%`;
                    badge.className = `text-[9px] px-1.5 py-0.2 rounded border font-bold ${pct >= 50 ? 'bg-emerald-950/40 text-emerald-400 border-emerald-800/30' : 'bg-rose-950/40 text-rose-400 border-rose-800/30'}`;
                } else {
                    badge.innerText = "DONE";
                    badge.className = "text-[9px] px-1.5 py-0.2 rounded border font-bold bg-indigo-950/40 text-indigo-400 border-indigo-800/30";
                }
            }

            updateScoreBannerDisplay();
            calculateOverallMetrics();
        }

        function resetCurrentRoom() {
            const data = examDatabase[activeRoomKey];
            roomScores[activeRoomKey] = { submitted: false, score: 0, total: 0 };
            
            const badge = document.getElementById(`badge-${activeRoomKey}`);
            if (badge) {
                badge.innerText = "IDLE";
                badge.className = "text-[9px] px-1.5 py-0.2 rounded bg-slate-900 border border-slate-800 text-slate-500 font-bold";
            }

            renderQuestions(data.questions);
            updateScoreBannerDisplay();
            calculateOverallMetrics();
        }

        function updateScoreBannerDisplay() {
            const banner = document.getElementById("room-score-banner");
            const state = roomScores[activeRoomKey];

            if (state && state.submitted && state.total > 0) {
                banner.classList.remove("hidden");
                document.getElementById("room-score-breakdown").innerText = `You processed ${state.score} out of ${state.total} structural compilation parameters correctly inside this module tracking viewport.`;
                const pct = Math.round((state.score / state.total) * 100);
                document.getElementById("room-percentage-badge").innerText = `${pct}%`;
            } else {
                banner.classList.add("hidden");
            }
        }

        function calculateOverallMetrics() {
            let totalScore = 0;
            let totalGraded = 0;
            let completedRooms = 0;
            const keys = Object.keys(roomScores);

            keys.forEach(key => {
                if (roomScores[key].submitted) {
                    completedRooms++;
                    totalScore += roomScores[key].score;
                    totalGraded += roomScores[key].total;
                }
            });

            const overallPct = totalGraded > 0 ? Math.round((totalScore / totalGraded) * 100) : 0;
            document.getElementById("overall-progress-bar").style.width = `${(completedRooms / keys.length) * 100}%`;
            document.getElementById("overall-score-txt").innerText = `${overallPct}% Overall Metric`;
        }

        window.onload = initializePlatform;
    </script>
